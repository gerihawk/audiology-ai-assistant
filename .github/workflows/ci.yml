name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: black --check .
      # Fase 12 hito 2: escaneo de vulnerabilidades conocidas en dependencias
      # de Python. Se ignoran explicitamente vulnerabilidades ya conocidas en
      # herramientas de desarrollo/build (nunca se empaquetan en la imagen de
      # produccion): black (PYSEC-2026-2120/2121), pytest (PYSEC-2026-1845) y
      # setuptools (PYSEC-2026-3447, transitiva del propio venv). Revisar esta
      # lista cuando se suban las versiones de black/pytest en pyproject.toml.
      - run: >
          pip-audit
          --ignore-vuln PYSEC-2026-2120
          --ignore-vuln PYSEC-2026-2121
          --ignore-vuln PYSEC-2026-1845
          --ignore-vuln PYSEC-2026-3447
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Fase 12 hito 2: escaneo de vulnerabilidades conocidas en dependencias
      # de npm. --omit=dev: solo audita dependencias de produccion (lo que de
      # verdad llega al navegador del usuario) — a fecha de este cambio, vite/
      # vitest (devDependencies) tienen vulnerabilidades altas/criticas sin fix
      # no-breaking; actualizarlas es un cambio de major version deliberado,
      # no algo que deba bloquear cada CI mientras tanto (deuda documentada).
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
