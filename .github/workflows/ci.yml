name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Instala exactamente lo fijado en backend/uv.lock (mismo uv y mismas
      # flags que backend/Dockerfile). `--locked` falla si uv.lock no está
      # sincronizado con pyproject.toml.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --extra dev
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: ruff check .
      - run: black --check .
      # Fase 12 hito 2: escaneo de vulnerabilidades conocidas en dependencias
      # de Python. Se ignoran explicitamente vulnerabilidades ya conocidas en
      # herramientas de desarrollo/build (nunca se empaquetan en la imagen de
      # produccion): black (PYSEC-2026-2120/2121), pytest (PYSEC-2026-1845) y
      # setuptools (PYSEC-2026-3447, transitiva del propio venv). Revisar esta
      # lista cuando se suban las versiones de black/pytest en pyproject.toml.
      # --skip-editable: excluye solo el propio proyecto (instalado editable
      # por uv sync), que nunca se publica en PyPI; consultarlo no aporta nada
      # y, si PyPI devuelve un 503 en vez de 404 para un paquete inexistente
      # (visto el 2026-09-25, transitorio), rompe el paso entero.
      - run: >
          pip-audit
          --skip-editable
          --ignore-vuln PYSEC-2026-2120
          --ignore-vuln PYSEC-2026-2121
          --ignore-vuln PYSEC-2026-1845
          --ignore-vuln PYSEC-2026-3447
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Fase 12 hito 2: escaneo de vulnerabilidades conocidas en dependencias
      # de npm. --omit=dev: solo audita dependencias de produccion (lo que de
      # verdad llega al navegador del usuario) — a fecha de este cambio, vite/
      # vitest (devDependencies) tienen vulnerabilidades altas/criticas sin fix
      # no-breaking; actualizarlas es un cambio de major version deliberado,
      # no algo que deba bloquear cada CI mientras tanto (deuda documentada).
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
