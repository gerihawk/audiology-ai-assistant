services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - audiology_net

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
      AUTH_MODE: ${AUTH_MODE:-fake}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-mock}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      ASSEMBLYAI_LANGUAGE_CODE: ${ASSEMBLYAI_LANGUAGE_CODE:-es}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      DEEPGRAM_BASE_URL: ${DEEPGRAM_BASE_URL:-https://api.eu.deepgram.com}
      DEEPGRAM_LANGUAGE_CODE: ${DEEPGRAM_LANGUAGE_CODE:-es}
      DEEPGRAM_MODEL: ${DEEPGRAM_MODEL:-nova-3}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GENERATION_BENCHMARK_ENABLED: ${GENERATION_BENCHMARK_ENABLED:-false}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_PROVIDER_SUMMARY: ${LLM_PROVIDER_SUMMARY:-mock}
      LLM_MODEL_SUMMARY: ${LLM_MODEL_SUMMARY:-}
      LLM_PROVIDER_PATIENT_SUMMARY: ${LLM_PROVIDER_PATIENT_SUMMARY:-mock}
      LLM_MODEL_PATIENT_SUMMARY: ${LLM_MODEL_PATIENT_SUMMARY:-}
      LLM_PROVIDER_MISSING_INFORMATION: ${LLM_PROVIDER_MISSING_INFORMATION:-mock}
      LLM_MODEL_MISSING_INFORMATION: ${LLM_MODEL_MISSING_INFORMATION:-}
      LLM_COST_LIMIT_ENFORCED: ${LLM_COST_LIMIT_ENFORCED:-false}
      MAX_LLM_COST_PER_SESSION_USD: ${MAX_LLM_COST_PER_SESSION_USD:-}
      AI_PROCESSING_CONSENT_ENFORCED: ${AI_PROCESSING_CONSENT_ENFORCED:-false}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - audiology_net

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      VITE_AUTH_MODE: ${VITE_AUTH_MODE:-fake}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - audiology_net

volumes:
  postgres_data:
  frontend_node_modules:

networks:
  audiology_net:
    driver: bridge
