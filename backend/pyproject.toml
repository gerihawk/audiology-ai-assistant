[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audiology-ai-assistant-backend"
version = "0.1.0"
description = "Backend FastAPI del MVP Audiology AI Assistant"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  # httpx: cliente HTTP genérico para AssemblyAITranscriptionProvider (API
  # REST oficial, sin SDK de terceros) — Fase 5. anyio: E/S de fichero
  # asíncrona para LocalAudioStorage. Ambos ya eran dependencias
  # transitivas de FastAPI/Starlette; se declaran explícitamente porque
  # ahora el código de aplicación los importa directamente.
  "httpx>=0.27,<1.0",
  "anyio>=4.0,<5.0",
  "python-multipart>=0.0.12,<1.0",
  # reportlab: generación de PDF en memoria (Platypus/SimpleDocTemplate)
  # para PdfDocumentExporter — Fase 6.6.3. Solo fuentes base14 (Helvetica),
  # sin binarios externos ni assets de fuente embebidos.
  "reportlab>=4.0,<6.0",
  # PyJWT: firma/verificación del JWT Bearer de autenticación real
  # (Fase 9, hito 9.1). bcrypt (directo, sin passlib): hash de contraseña
  # de `users.password_hash`.
  "PyJWT>=2.10,<3.0",
  "bcrypt>=4.2,<6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.7,<1.0",
  "black>=24.10,<25.0",
  # pypdf: solo para verificar en tests que PdfDocumentExporter produce un
  # PDF válido (parseo/nº páginas/texto) — nunca código de producción.
  "pypdf>=5.0,<7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "BLE"]
# B008: FastAPI usa Depends(...) como valor por defecto de forma
# intencionada (patrón de inyección de dependencias del framework).
# UP046: los modelos genéricos de Pydantic v2 (Page(BaseModel, Generic[T]))
# usan typing.Generic, no la sintaxis de parámetros de tipo de PEP 695.
ignore = ["B008", "UP046"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
